[package]
name = "bolo"
version = "0.1.9"
description = "Free voice dictation"
authors = ["peeenudotcom"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bolo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
cpal = "0.18.2"
whisper-rs = "0.16.0"
hound = "3.5.1"
arboard = "3.7.0"
enigo = "0.6.1"
anyhow = "1.0.104"
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt", "time", "sync", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "stream", "http2", "system-proxy"] }
active-win-pos-rs = "0.11.0"
regex = "1.13.1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
semver = "1"
chrono = "0.4"
earshot = "1.2.2"
base64 = "0.22"
sha2 = "0.11"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tauri-plugin-notification = "2.8.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["shared"] }
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
screencapturekit = "=11.1.2"
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"] }

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5.3"

[target."cfg(windows)".build-dependencies]
# Ensure the matching native runtime is ready before build.rs stages DLLs.
sherpa-onnx-sys = { version = "=2.0.1", default-features = false, features = ["shared"] }
