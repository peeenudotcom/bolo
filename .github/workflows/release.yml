name: Release

# Push a tag like v0.1.0 to build installers for Windows and macOS
# and attach them to a draft GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Both Apple targets can build on Intel; avoid the ARM runner queue.
          - platform: macos-15-intel
            args: "--target aarch64-apple-darwin"
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Mac SDK
        if: matrix.platform == 'macos-15-intel'
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer

      # whisper.cpp built with MSVC is ~10x slower; use clang-cl + Ninja.
      - name: Windows build environment
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CMAKE_C_COMPILER=clang-cl" >> $env:GITHUB_ENV
          "CMAKE_CXX_COMPILER=clang-cl" >> $env:GITHUB_ENV
          "CXXFLAGS_x86_64_pc_windows_msvc=/EHsc" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows-latest'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15-intel' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The native crate stages runtime DLLs outside cached library artifacts.
      # Re-run its build script so a restored Rust cache cannot omit installer DLLs.
      - name: Stage Windows meeting runtime
        if: matrix.platform == 'windows-latest'
        run: cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-onnx-sys

      - run: npm ci
      - run: npm run test:words
      - run: npm run test:meetings

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update packages; tauri-action then publishes latest.json so
          # installed copies can update themselves. The key lives in the repo
          # secret TAURI_SIGNING_PRIVATE_KEY (local copy: ~/.tauri/bolo-updater.key).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Bolo ${{ github.ref_name }}
          releaseBody: Download the installer for your computer below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify Mac bundle signature
        if: matrix.platform == 'macos-15-intel'
        shell: bash
        run: |
          APP=$(find src-tauri/target -path '*/bundle/macos/Bolo.app' -type d -print -quit)
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
