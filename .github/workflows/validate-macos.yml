name: Validate macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src-tauri/**', 'src/**', '.github/workflows/validate-macos.yml']
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            xcode: 26.1.1
          - runner: macos-26
            target: aarch64-apple-darwin
            xcode: 26.4.1
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run test:words
      - run: npm run test:meetings
      - run: npm run build
      - run: cargo test --release --lib --manifest-path src-tauri/Cargo.toml
      - name: Exercise local speaker models
        run: |
          mkdir -p .scratch/meeting-models
          curl -fL --retry 3 'https://huggingface.co/csukuangfj/sherpa-onnx-pyannote-segmentation-3-0/resolve/9403a69/model.int8.onnx' -o .scratch/meeting-models/segmentation.onnx
          curl -fL --retry 3 'https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx' -o .scratch/meeting-models/embedding.onnx
          cargo test --release --lib --manifest-path src-tauri/Cargo.toml local_speaker_models_load_and_process_speech -- --ignored
      - run: npm run tauri build -- --bundles app
      - name: Verify signed bundle and native runtime
        run: |
          APP=src-tauri/target/release/bundle/macos/Bolo.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1
          codesign -d --entitlements :- "$APP" > .scratch/entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' .scratch/entitlements.plist | grep -qx true
          otool -L "$APP/Contents/MacOS/bolo"
          "$APP/Contents/MacOS/bolo" --check-runtime
          ditto -c -k --sequesterRsrc --keepParent "$APP" Bolo-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bolo-${{ matrix.target }}-validation
          path: Bolo-${{ matrix.target }}.zip
